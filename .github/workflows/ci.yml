name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Show required formatting diff
        shell: bash
        run: |
          mapfile -d '' files < <(find lib src test config -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0)
          clang-format -i "${files[@]}"
          git diff --exit-code -- lib src test config

      - name: Run native protocol tests
        run: python -m platformio test -e native

      - name: Build ESP32-S3 reference firmware
        run: python -m platformio run -e esp32s3
