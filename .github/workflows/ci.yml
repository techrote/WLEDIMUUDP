name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Read release version
        id: release
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check bootstrap dependencies
        run: python scripts/bootstrap.py --check

      - name: Check release and credential hygiene
        run: python scripts/release_check.py

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find lib src test config -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0)
          clang-format --dry-run --Werror "${files[@]}"

      - name: Run native tests
        run: python -m platformio test -e native

      - name: Build host Audio Sync probe
        run: python -m platformio run -e host_probe

      - name: Smoke-test host probe
        run: ./.pio/build/host_probe/program send --dry-run --pattern single-band --frames 2

      - name: Build motion mapper probe
        run: python -m platformio run -e mapping_probe

      - name: Smoke-test motion mapper probe
        run: ./.pio/build/mapping_probe/program spin

      - name: Build ESP32-S3 reference firmware
        run: python -m platformio run -e esp32s3

      - name: Assemble release bundle
        run: >-
          python scripts/make_release_bundle.py
          --output "dist/WLEDIMUUDP-${{ steps.release.outputs.version }}"
          --revision "$GITHUB_SHA"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: WLEDIMUUDP-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: dist/WLEDIMUUDP-${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 14
