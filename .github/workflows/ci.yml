name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find lib src test config -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0)
          clang-format --dry-run --Werror "${files[@]}"

      - name: Run native tests
        run: python -m platformio test -e native

      - name: Build host Audio Sync probe
        run: python -m platformio run -e host_probe

      - name: Smoke-test host probe
        run: ./.pio/build/host_probe/program send --dry-run --pattern single-band --frames 2

      - name: Build motion mapper probe
        run: python -m platformio run -e mapping_probe

      - name: Smoke-test motion mapper probe
        run: ./.pio/build/mapping_probe/program spin

      - name: Build ESP32-S3 reference firmware
        run: python -m platformio run -e esp32s3
