[platformio]
default_envs = native

[env]
lib_ldf_mode = deep+
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic

[env:native]
platform = native
test_framework = unity
build_flags =
  ${env.build_flags}
  -Werror

[env:esp32s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
