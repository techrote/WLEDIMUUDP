[platformio]
default_envs = native

[env]
lib_ldf_mode = deep+
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  -I config

[env:native]
platform = native
test_framework = unity
build_flags =
  ${env.build_flags}
  -Werror
extra_scripts =
  pre:scripts/native_host_flags.py

[env:host_probe]
platform = native
build_flags =
  ${env.build_flags}
  -Werror
build_src_filter =
  +<host_probe.cpp>
extra_scripts =
  pre:scripts/native_host_flags.py

[env:mapping_probe]
platform = native
build_flags =
  ${env.build_flags}
  -Werror
build_src_filter =
  +<mapping_probe.cpp>
extra_scripts =
  pre:scripts/native_host_flags.py

[env:esp32s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
# Arduino-ESP32 2.0.16 / ESP-IDF headers intentionally use GNU anonymous structs and
# zero-length arrays. Keep native project code pedantic + Werror; suppress only that
# third-party extension noise in the embedded compile while retaining Wall/Wextra.
build_flags =
  ${env.build_flags}
  -Wno-pedantic
build_src_filter =
  +<main.cpp>
  +<qmi8658_adapter.cpp>
